schema_version: 1

context:
  name: upstash-redis
  version: 1.8.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/upstash_redis-${{ version }}.tar.gz
  sha256: 5fcd172802f517473b711de2fd1d2d2587c13c816cd2c570ad66fceb4f77e695

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - httpx >=0.23.0,<1
    - python >=${{ python_min }},<4.0.0
    - aiohttp >=3.8.4,<4.0.0
    - requests >=2.31.0,<3.0.0

tests:
  - python:
      imports:
        - upstash_redis
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Serverless Redis SDK from Upstash
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/upstash/redis-python

extra:
  recipe-maintainers:
    - jan-janssen
