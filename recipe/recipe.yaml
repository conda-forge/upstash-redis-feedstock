schema_version: 1

context:
  name: upstash-redis
  version: 1.9.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/upstash_redis-${{ version }}.tar.gz
  sha256: a970603791101271ad30eaa9e68de4678b653c09f373864188452c23938a9b19

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - httpx >=0.23.0,<1
    - python >=${{ python_min }},<4.0.0
tests:
  - python:
      imports:
        - upstash_redis
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: Serverless Redis SDK from Upstash
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/upstash/redis-python

extra:
  recipe-maintainers:
    - jan-janssen
